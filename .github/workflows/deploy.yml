name: Deploy Vue Frontend

# 触发条件：当代码推送到 main 分支时执行（如果你的主分支叫 master，请改成 master）
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # 使用 GitHub 免费的 Ubuntu 服务器

    steps:
      # 1. 拉取最新代码
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. 安装 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24" # 保持和你本地差不多的 Node 版本

      # 3. 安装依赖并打包
      - name: Install Dependencies and Build
        run: |
          npm install
          npm run build

      # 4. 把打包好的 dist 文件夹传到阿里云服务器
      - name: Deploy to Aliyun Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22 # 默认 SSH 端口
          source: "dist/*" # 要上传的文件
          target: "/www/wwwroot/todo" # 传到服务器的哪个目录下（它会自动覆盖原有的 dist）
          strip_components: 0
